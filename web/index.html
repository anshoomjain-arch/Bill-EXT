<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bill Extractor</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Bill Extractor</h1>
    <p class="lede">Upload a KESCO / UPPCL electricity bill image. PaddleOCR reads it and the fields are
      extracted into a table.</p>
  </header>

  <section class="card" aria-labelledby="upload-h">
    <h2 id="upload-h">1. Upload bill</h2>
    <form id="upload-form">
      <label class="drop" for="file">
        <input id="file" name="file" type="file" accept="image/png,image/jpeg" required>
        <span id="file-label">Choose a PNG or JPEG image (max 10 MB)</span>
      </label>
      <img id="preview" alt="Preview of the selected bill" hidden>
      <button id="submit" type="submit" disabled>Extract fields</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="pipelines" hidden>
      <p class="pipe"><span class="pipe-name">Rules (pipeline 1)</span> <span id="status-rules" role="status" aria-live="polite"></span></p>
      <p class="pipe"><span class="pipe-name">Qwen3 32B (pipeline 2)</span> <span id="status-qwen" role="status" aria-live="polite"></span></p>
    </div>
  </section>

  <section class="card" id="results" hidden aria-labelledby="results-h">
    <div class="results-head">
      <h2 id="results-h">2. Extracted fields</h2>
      <button id="download" type="button" class="secondary">Download CSV</button>
    </div>
    <p id="summary" class="summary"></p>

    <dl id="llm" class="llm" hidden>
      <div><dt>Model</dt><dd id="llm-model"></dd></div>
      <div><dt>Model calls</dt><dd id="llm-calls"></dd></div>
      <div><dt>Input tokens</dt><dd id="llm-in"></dd></div>
      <div><dt>Output tokens</dt><dd id="llm-out"></dd></div>
      <div><dt>Total tokens</dt><dd id="llm-total"></dd></div>
      <div><dt>LLM time</dt><dd id="llm-time"></dd></div>
      <div><dt>OCR time</dt><dd id="llm-ocr"></dd></div>
    </dl>

    <div class="table-wrap">
      <table id="fields">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
